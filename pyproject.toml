[project]
name = "deepvault"
version = "4.0.0"
description = "Enterprise-grade autonomous RAG system for high-performance semantic search and retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "arize-phoenix>=17.14.0",
    "arize-phoenix-otel>=0.16.1",
    "datasets>=5.0.0",
    "fastapi>=0.135.3",
    "groq>=0.30.0",
    "httpx>=0.28.1",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "litellm>=1.90.2",
    "markdown>=3.6",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.17.1",
    "ragas==0.2.9",
    "rank-bm25>=0.2.2",
    "redis>=7.4.0",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.56.0",
    "tenacity>=9.1.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.43.0",
    "xhtml2pdf>=0.2.16",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.1.5",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
# Provide a safe test API key so pydantic Settings doesn't fail on import.
# This is NOT a real secret — it is only used in the test environment.
env = ["API_KEY=dv-test-only-not-a-real-secret-abc123"]
markers = [
    "unit: pure unit tests — no infrastructure required (fast, always run in CI)",
    "integration: requires live Qdrant + Redis (skipped in CI without infra)",
    "eval: requires Langfuse + Groq API keys (slow, run manually)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt files contain intentional multi-line strings that cannot be wrapped
"app/prompts/**" = ["E501"]
# Scripts contain long f-strings in print/argparse that are hard to break cleanly
"scripts/**" = ["E501"]
# Streamlit UI files have long inline HTML strings
"app/ui/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = [
    '^\.venv/',
    '^venv/',
    '^scripts/',
    '^tests/',
]
