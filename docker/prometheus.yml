global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "development"
    project: "deepvault"

scrape_configs:
  - job_name: "deepvault-api"
    static_configs:
      - targets: ["deepvault-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
